<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cirrus</title>
<style>
  :root {
    --bg: #16140f;
    --surface: #201d17;
    --text: #f2ede3;
    --muted: #b8ae9c;
    --accent: #d9ab74;
    --border: #353027;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #faf8f4;
      --surface: #ffffff;
      --text: #1c1a15;
      --muted: #5f5849;
      --accent: #9a6b2f;
      --border: #e4ded2;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 3rem 1.25rem;
    background: var(--bg);
    color: var(--text);
    font: 16px/1.65 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    -webkit-text-size-adjust: 100%;
  }
  main { max-width: 32rem; width: 100%; }
  /* The wordmark IS the logo, so the h1 carries the image and keeps its text in `alt`
     for screen readers and for the case where the image fails to load. */
  /* Logo and tagline centred as a unit — they read as one masthead, and a left-aligned
     logo above centred-width content looked like a stray element. The prose below stays
     left-aligned, because centred paragraphs are harder to read. */
  h1 { margin: 0 0 .5rem; line-height: 0; text-align: center; }
  h1 img { width: 210px; max-width: 62%; height: auto; }
  /* The artwork is cream-on-transparent, drawn for a dark ground — on a light one it
     would all but vanish. Darkening rather than shipping a second asset: one file to
     keep in sync with the app's own SplashLogo, not two. */
  @media (prefers-color-scheme: light) {
    h1 img { filter: brightness(.32) saturate(1.45); }
  }
  .tagline { color: var(--muted); font-size: 1.05rem; margin: 0 0 2.5rem; text-align: center; }
  .claim {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 12px; padding: 1.25rem 1.35rem; margin: 0 0 2.5rem;
    font-size: .95rem;
  }
  .claim strong { color: var(--accent); }
  nav { display: flex; flex-wrap: wrap; gap: 1.25rem; }
  nav a { color: var(--accent); text-decoration: none; font-weight: 500; }
  nav a:hover { text-decoration: underline; }
  footer { margin-top: 3rem; color: var(--muted); font-size: .8rem; }
</style>
</head>
<body>
<main>

  <h1><img src="/logo.png" alt="Cirrus" width="420" height="260"></h1>
  <p class="tagline">A daily recovery score, computed on your iPhone.</p>

  <div class="claim">
    Cirrus reads your Apple Health signals, works out how recovered you are, and shows you why —
    <strong>entirely on your device</strong>. Your health data is never uploaded, never sold, and
    never seen by us. No account required.
  </div>

  <nav>
    <a href="/privacy">Privacy Policy</a>
  </nav>

  <footer>© 2026 Cirrus</footer>

</main>
</body>
</html>
